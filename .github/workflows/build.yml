name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir src && unzip -q Orbit.zip -d src
          chmod +x src/gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: src
        run: |
          set -o pipefail
          ./gradlew assembleDebug --continue 2>&1 | tee ../build.log

      - name: Show errors
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |^w: .*error|error:|What went wrong|Could not|Unresolved|Execution failed' -A2 build.log | grep -v '^\s*at ' | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk Orbit.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Orbit.apk --title "Orbit" --notes "Tap Orbit.apk to install." --latest
